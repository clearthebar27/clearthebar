name: fetch-logs
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy requests nba_api
      - run: python fetch_logs.py
      - run: python build_board_snapshot.py "$(date -u +%m/%d/%Y)"
      - run: python grade_board.py "$(date -u -d yesterday +%m/%d/%Y)" || true
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add logs_nba.csv.gz boards results odds.csv || true
          git commit -m "daily $(date -u +%F)" || true
          git push || true
